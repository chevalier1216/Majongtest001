name: Publish mahjong to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify game
        run: node --test tests/*.test.mjs
      - name: Build production release
        run: node scripts/build.mjs
      - name: Install browser for layout checks
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check rendered tile sizes and orientations
        run: |
          node tests/layout.browser.mjs
          node tests/save.browser.mjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-layout
          path: qa-output
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the published game
        env:
          PUBLISHED_BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          for file in index.html app.mjs engine.mjs scoring.mjs responsive.css save-game.mjs viewport.mjs sw.js; do
            target_path="$RUNNER_TEMP/published-$file"
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 20 "$PUBLISHED_BASE$file?revision=$GITHUB_SHA" --output "$target_path" && cmp --silent "site/$file" "$target_path"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                printf 'Published file does not match: %s\n' "$file"
                exit 1
              fi
              sleep 10
            done
            printf 'Verified published %s\n' "$file"
          done
